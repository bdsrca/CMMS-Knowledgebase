<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="Tenant-aware CMMS knowledge base architecture">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fbff; stroke: #b8cdf4; stroke-width: 2; rx: 18; }
      .panel2 { fill: #f7fffd; stroke: #9bd8d2; stroke-width: 2; rx: 18; }
      .box { fill: #ffffff; stroke: #c6d6ee; stroke-width: 1.7; rx: 12; }
      .step { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f1f46; }
      .subtitle { font: 600 18px Arial, sans-serif; fill: #1e3a8a; }
      .text { font: 600 18px Arial, sans-serif; fill: #10203f; }
      .small { font: 500 15px Arial, sans-serif; fill: #40516f; }
      .guard { font: 700 24px Arial, sans-serif; fill: #0f3b5f; }
      .arrow { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .dot { fill: #2563eb; }
      .icon { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="760"/>

  <rect class="panel" x="35" y="45" width="330" height="540" rx="18"/>
  <text class="title" x="78" y="95">Knowledge Sources</text>
  <g transform="translate(70 135)">
    <rect class="box" x="0" y="0" width="260" height="68" rx="12"/>
    <rect class="icon" x="18" y="16" width="36" height="36" rx="8"/>
    <text class="text" x="78" y="43">SOPs</text>
    <rect class="box" x="0" y="86" width="260" height="68" rx="12"/>
    <rect class="icon" x="18" y="102" width="36" height="36" rx="8"/>
    <text class="text" x="78" y="129">FAQs</text>
    <rect class="box" x="0" y="172" width="260" height="68" rx="12"/>
    <rect class="icon" x="18" y="188" width="36" height="36" rx="8"/>
    <text class="text" x="78" y="215">Manuals</text>
    <rect class="box" x="0" y="258" width="260" height="68" rx="12"/>
    <rect class="icon" x="18" y="274" width="36" height="36" rx="8"/>
    <text class="text" x="78" y="301">Help Articles</text>
    <rect class="box" x="0" y="344" width="260" height="78" rx="12"/>
    <rect class="icon" x="18" y="365" width="36" height="36" rx="8"/>
    <text class="text" x="78" y="375">PM / Inventory</text>
    <text class="text" x="78" y="401">Rules</text>
  </g>

  <rect class="panel" x="500" y="45" width="420" height="540" rx="18"/>
  <text class="title" x="555" y="95">Controlled KB Pipeline</text>
  <g transform="translate(570 130)">
    <rect class="step" x="0" y="0" width="280" height="52" rx="12"/>
    <text class="text" x="55" y="33">Source Management</text>
    <line class="arrow" x1="140" y1="55" x2="140" y2="82"/>
    <rect class="step" x="0" y="88" width="280" height="52" rx="12"/>
    <text class="text" x="63" y="121">Document Intake</text>
    <line class="arrow" x1="140" y1="143" x2="140" y2="170"/>
    <rect class="step" x="0" y="176" width="280" height="52" rx="12"/>
    <text class="text" x="62" y="209">Async Ingest Job</text>
    <line class="arrow" x1="140" y1="231" x2="140" y2="258"/>
    <rect class="step" x="0" y="264" width="280" height="52" rx="12"/>
    <text class="text" x="98" y="297">Chunking</text>
    <line class="arrow" x1="140" y1="319" x2="140" y2="346"/>
    <rect class="step" x="0" y="352" width="280" height="52" rx="12"/>
    <text class="text" x="92" y="385">Embeddings</text>
    <line class="arrow" x1="140" y1="407" x2="140" y2="434"/>
    <rect class="step" x="0" y="440" width="280" height="52" rx="12"/>
    <text class="text" x="77" y="473">Hybrid Retrieval</text>
  </g>

  <rect class="panel2" x="1040" y="45" width="325" height="540" rx="18"/>
  <text class="title" x="1082" y="95">CMMS AI Assistant</text>
  <g transform="translate(1075 150)">
    <rect class="box" x="0" y="0" width="255" height="72" rx="12"/>
    <text class="text" x="72" y="43">Cited Answer</text>
    <rect class="box" x="0" y="92" width="255" height="72" rx="12"/>
    <text class="text" x="72" y="135">Confidence Score</text>
    <rect class="box" x="0" y="184" width="255" height="72" rx="12"/>
    <text class="text" x="72" y="227">Next Actions</text>
    <rect class="box" x="0" y="276" width="255" height="72" rx="12"/>
    <text class="text" x="72" y="319">Query Log</text>
  </g>

  <line class="arrow" x1="365" y1="315" x2="486" y2="315"/>
  <line class="arrow" x1="920" y1="315" x2="1025" y2="315"/>

  <rect class="panel" x="120" y="625" width="1160" height="85" rx="18"/>
  <text class="guard" x="315" y="678">Tenant Isolation</text>
  <circle class="dot" cx="573" cy="670" r="6"/>
  <text class="guard" x="620" y="678">Role Access</text>
  <circle class="dot" cx="815" cy="670" r="6"/>
  <text class="guard" x="862" y="678">No Private Data in Logs</text>
</svg>
