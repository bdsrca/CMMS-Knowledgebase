<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="Hybrid retrieval to cited AI answer">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f1f46; }
      .box { fill: #f8fbff; stroke: #9bbcf2; stroke-width: 2; rx: 16; }
      .policy { fill: #f7fffd; stroke: #0f766e; stroke-width: 1.8; rx: 14; }
      .text { font: 700 18px Arial, sans-serif; fill: #10203f; }
      .small { font: 600 14px Arial, sans-serif; fill: #40516f; }
      .arrow { stroke: #2563eb; stroke-width: 3.5; fill: none; marker-end: url(#arrowhead); }
      .guard { stroke: #0f766e; stroke-width: 2.5; stroke-dasharray: 7 7; fill: none; marker-end: url(#guardhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="guardhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect class="bg" width="1400" height="620"/>
  <text class="title" x="410" y="70">Hybrid Retrieval to Cited AI Answer</text>

  <rect class="box" x="40" y="230" width="135" height="130" rx="16"/>
  <text class="text" x="70" y="285">User</text><text class="text" x="58" y="315">Question</text>
  <line class="arrow" x1="180" y1="295" x2="225" y2="295"/>

  <rect class="box" x="235" y="230" width="150" height="130" rx="16"/>
  <text class="text" x="268" y="285">Query</text><text class="text" x="248" y="315">Normalization</text>
  <line class="arrow" x1="390" y1="295" x2="435" y2="295"/>

  <rect class="box" x="445" y="170" width="240" height="250" rx="16"/>
  <text class="text" x="495" y="210">Parallel Retrieval</text>
  <rect class="box" x="480" y="245" width="170" height="60" rx="12"/>
  <text class="text" x="510" y="282">Full-text Search</text>
  <rect class="box" x="480" y="325" width="170" height="60" rx="12"/>
  <text class="text" x="520" y="362">Vector Search</text>

  <line class="arrow" x1="690" y1="295" x2="735" y2="295"/>
  <rect class="box" x="745" y="230" width="150" height="130" rx="16"/>
  <text class="text" x="777" y="278">Rank</text><text class="text" x="770" y="308">Fusion</text>
  <line class="arrow" x1="900" y1="295" x2="945" y2="295"/>

  <rect class="box" x="955" y="230" width="150" height="130" rx="16"/>
  <text class="text" x="982" y="278">Evidence</text><text class="text" x="990" y="308">Chunks</text>
  <line class="arrow" x1="1110" y1="295" x2="1155" y2="295"/>

  <rect class="policy" x="1165" y="220" width="170" height="150" rx="16"/>
  <text class="text" x="1200" y="276">Grounded</text><text class="text" x="1205" y="306">AI Answer</text>

  <rect class="policy" x="792" y="92" width="250" height="58" rx="14"/>
  <text class="small" x="825" y="126">Answer only from retrieved context</text>
  <line class="guard" x1="917" y1="152" x2="1248" y2="214"/>

  <rect class="policy" x="760" y="455" width="230" height="60" rx="14"/>
  <text class="small" x="796" y="480">Tenant and role filters</text>
  <text class="small" x="820" y="500">applied before retrieval</text>
  <line class="guard" x1="875" y1="453" x2="565" y2="425"/>

  <rect class="box" x="1115" y="430" width="245" height="100" rx="16"/>
  <text class="text" x="1155" y="466">Output</text>
  <text class="small" x="1155" y="492">Citations + confidence</text>
  <text class="small" x="1155" y="512">Next actions + query log</text>
</svg>
