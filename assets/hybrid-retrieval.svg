<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.58" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <style>
      .muted { fill:#64748b; }
      .small { font-size:13px; }
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1400" height="700" rx="24" fill="url(#bg)"/>
<text x="48" y="68" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:36px; font-weight:800; fill:#0f172a;"><tspan x="48" dy="0">Hybrid Retrieval: Exact Terms + Maintenance Semantics</tspan></text><text x="50" y="105" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:17px; font-weight:400; fill:#475569;"><tspan x="50" dy="0">Maintenance users mix exact CMMS labels, local phrases, asset names, and informal fault descriptions. Retrieval needs both paths.</tspan></text><rect x="72" y="188" width="260" height="140" rx="22" fill="#0f172a" opacity="0.06"/><rect x="70" y="185" width="260" height="140" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/><text x="95" y="235" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:22px; font-weight:800; fill:#1e3a8a;"><tspan x="95" dy="0">User question</tspan></text><text x="95" y="275" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:16px; font-weight:600; fill:#0f172a;"><tspan x="95" dy="0">"Why did inventory not change</tspan><tspan x="95" dy="21">after approval?"</tspan></text><line x1="335" y1="255" x2="420" y2="255" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="432" y="148" width="270" height="150" rx="22" fill="#0f172a" opacity="0.06"/><rect x="430" y="145" width="270" height="150" rx="22" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/><text x="458" y="195" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:22px; font-weight:800; fill:#065f46;"><tspan x="458" dy="0">Full-text branch</tspan></text><text x="458" y="235" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:15px; font-weight:400; fill:#475569;"><tspan x="458" dy="0">Finds exact terms: approval,</tspan><tspan x="458" dy="20">inventory, issue, status labels.</tspan></text><rect x="432" y="338" width="270" height="150" rx="22" fill="#0f172a" opacity="0.06"/><rect x="430" y="335" width="270" height="150" rx="22" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/><text x="458" y="385" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:22px; font-weight:800; fill:#5b21b6;"><tspan x="458" dy="0">Vector branch</tspan></text><text x="458" y="425" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:15px; font-weight:400; fill:#475569;"><tspan x="458" dy="0">Finds similar meaning: stock not</tspan><tspan x="458" dy="20">deducted, parts not consumed.</tspan></text><line x1="705" y1="220" x2="805" y2="300" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="705" y1="410" x2="805" y2="330" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="817" y="228" width="220" height="150" rx="22" fill="#0f172a" opacity="0.06"/><rect x="815" y="225" width="220" height="150" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/><text x="845" y="275" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:22px; font-weight:800; fill:#9a3412;"><tspan x="845" dy="0">Rank fusion</tspan></text><text x="845" y="315" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:15px; font-weight:400; fill:#475569;"><tspan x="845" dy="0">Merge, deduplicate, and keep</tspan><tspan x="845" dy="20">the strongest evidence.</tspan></text><line x1="1040" y1="300" x2="1125" y2="300" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1137" y="188" width="210" height="230" rx="22" fill="#0f172a" opacity="0.06"/><rect x="1135" y="185" width="210" height="230" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/><text x="1160" y="235" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:22px; font-weight:800; fill:#0f172a;"><tspan x="1160" dy="0">Answer package</tspan></text><text x="1160" y="280" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:16px; font-weight:500; fill:#475569;"><tspan x="1160" dy="0">• direct answer</tspan><tspan x="1160" dy="25">• citations</tspan><tspan x="1160" dy="25">• confidence</tspan><tspan x="1160" dy="25">• next actions</tspan><tspan x="1160" dy="25">• retrieved hits</tspan></text><rect x="92" y="543" width="1220" height="84" rx="20" fill="#0f172a" opacity="0.06"/><rect x="90" y="540" width="1220" height="84" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="120" y="568" width="161" height="34" rx="17" fill="#dbeafe" stroke="#dbeafe"/><text x="200" y="590" text-anchor="middle" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:13px; font-weight:700; fill:#2563eb;"><tspan x="200" dy="0">tenant filter</tspan></text><rect x="299" y="568" width="147" height="34" rx="17" fill="#dcfce7" stroke="#dcfce7"/><text x="372" y="590" text-anchor="middle" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:13px; font-weight:700; fill:#047857;"><tspan x="372" dy="0">role filter</tspan></text><rect x="464" y="568" width="161" height="34" rx="17" fill="#fef3c7" stroke="#fef3c7"/><text x="544" y="590" text-anchor="middle" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:13px; font-weight:700; fill:#b45309;"><tspan x="544" dy="0">source status</tspan></text><rect x="643" y="568" width="203" height="34" rx="17" fill="#ede9fe" stroke="#ede9fe"/><text x="744" y="590" text-anchor="middle" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:13px; font-weight:700; fill:#6d28d9;"><tspan x="744" dy="0">language / metadata</tspan></text><rect x="864" y="568" width="273" height="34" rx="17" fill="#fee2e2" stroke="#fee2e2"/><text x="1000" y="590" text-anchor="middle" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:13px; font-weight:700; fill:#b91c1c;"><tspan x="1000" dy="0">no raw retrieved text in logs</tspan></text></svg>
