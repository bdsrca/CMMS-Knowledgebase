  <rect width="1400" height="660" rx="24" fill="url(#bg)"/>
<text x="48" y="68" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:34px; font-weight:800; fill:#0f172a;"><tspan x="48" dy="0">Ingest Pipeline: From Approved Document to Searchable Knowledge</tspan></text><text x="50" y="105" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:17px; font-weight:400; fill:#475569;"><tspan x="50" dy="0">Document saves return quickly. Expensive work is visible, retryable, and scoped to the right tenant.</tspan></text><rect x="62" y="193" width="170" height="240" rx="18" fill="#0f172a" opacity="0.06"/><rect x="60" y="190" width="170" height="240" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/><rect x="78" y="214" width="38" height="28" rx="14" fill="#2563eb" stroke="#2563eb"/><text x="97" y="233" text-anchor="middle" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:13px; font-weight:700; fill:#fff;"><tspan x="97" dy="0">1</tspan></text><text x="78" y="270" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:19px; font-weight:800; fill:#0f172a;"><tspan x="78" dy="0">Document saved</tspan></text><text x="78" y="330" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:14px; font-weight:400; fill:#475569;"><tspan x="78" dy="0">Title, language,</tspan><tspan x="78" dy="19">source, raw text,</tspan><tspan x="78" dy="19">metadata</tspan></text><line x1="234" y1="310" x2="270" y2="310" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="247" y="193" width="170" height="240" rx="18" fill="#0f172a" opacity="0.06"/><rect x="245" y="190" width="170" height="240" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/><rect x="263" y="214" width="38" height="28" rx="14" fill="#2563eb" stroke="#2563eb"/><text x="282" y="233" text-anchor="middle" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:13px; font-weight:700; fill:#fff;"><tspan x="282" dy="0">2</tspan></text><text x="263" y="270" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:19px; font-weight:800; fill:#0f172a;"><tspan x="263" dy="0">Job queued</tspan></text><text x="263" y="330" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:14px; font-weight:400; fill:#475569;"><tspan x="263" dy="0">PENDING job</tspan><tspan x="263" dy="19">records the source</tspan><tspan x="263" dy="19">and request</tspan><tspan x="263" dy="19">context</tspan></text><line x1="419" y1="310" x2="455" y2="310" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="432" y="193" width="170" height="240" rx="18" fill="#0f172a" opacity="0.06"/><rect x="430" y="190" width="170" height="240" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/><rect x="448" y="214" width="38" height="28" rx="14" fill="#2563eb" stroke="#2563eb"/><text x="467" y="233" text-anchor="middle" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:13px; font-weight:700; fill:#fff;"><tspan x="467" dy="0">3</tspan></text><text x="448" y="270" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:19px; font-weight:800; fill:#0f172a;"><tspan x="448" dy="0">Worker claims</tspan></text><text x="448" y="330" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:14px; font-weight:400; fill:#475569;"><tspan x="448" dy="0">Claim only if</tspan><tspan x="448" dy="19">tenant and state</tspan><tspan x="448" dy="19">match</tspan></text><line x1="604" y1="310" x2="640" y2="310" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="617" y="193" width="170" height="240" rx="18" fill="#0f172a" opacity="0.06"/><rect x="615" y="190" width="170" height="240" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/><rect x="633" y="214" width="38" height="28" rx="14" fill="#2563eb" stroke="#2563eb"/><text x="652" y="233" text-anchor="middle" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:13px; font-weight:700; fill:#fff;"><tspan x="652" dy="0">4</tspan></text><text x="633" y="270" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:19px; font-weight:800; fill:#0f172a;"><tspan x="633" dy="0">Text chunked</tspan></text><text x="633" y="330" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:14px; font-weight:400; fill:#475569;"><tspan x="633" dy="0">Overlapping chunks</tspan><tspan x="633" dy="19">preserve SOP</tspan><tspan x="633" dy="19">context</tspan></text><line x1="789" y1="310" x2="825" y2="310" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="802" y="193" width="170" height="240" rx="18" fill="#0f172a" opacity="0.06"/><rect x="800" y="190" width="170" height="240" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/><rect x="818" y="214" width="38" height="28" rx="14" fill="#2563eb" stroke="#2563eb"/><text x="837" y="233" text-anchor="middle" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:13px; font-weight:700; fill:#fff;"><tspan x="837" dy="0">5</tspan></text><text x="818" y="270" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:19px; font-weight:800; fill:#0f172a;"><tspan x="818" dy="0">Embeddings</tspan><tspan x="818" dy="22">batched</tspan></text><text x="818" y="330" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:14px; font-weight:400; fill:#475569;"><tspan x="818" dy="0">Provider calls</tspan><tspan x="818" dy="19">stay predictable</tspan></text><line x1="974" y1="310" x2="1010" y2="310" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="987" y="193" width="170" height="240" rx="18" fill="#0f172a" opacity="0.06"/><rect x="985" y="190" width="170" height="240" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/><rect x="1003" y="214" width="38" height="28" rx="14" fill="#2563eb" stroke="#2563eb"/><text x="1022" y="233" text-anchor="middle" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:13px; font-weight:700; fill:#fff;"><tspan x="1022" dy="0">6</tspan></text><text x="1003" y="270" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:19px; font-weight:800; fill:#0f172a;"><tspan x="1003" dy="0">Chunks</tspan><tspan x="1003" dy="22">replaced</tspan></text><text x="1003" y="330" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:14px; font-weight:400; fill:#475569;"><tspan x="1003" dy="0">Searchable rows</tspan><tspan x="1003" dy="19">match current</tspan><tspan x="1003" dy="19">source text</tspan></text><line x1="1159" y1="310" x2="1195" y2="310" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1172" y="193" width="170" height="240" rx="18" fill="#0f172a" opacity="0.06"/><rect x="1170" y="190" width="170" height="240" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/><rect x="1188" y="214" width="38" height="28" rx="14" fill="#2563eb" stroke="#2563eb"/><text x="1207" y="233" text-anchor="middle" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:13px; font-weight:700; fill:#fff;"><tspan x="1207" dy="0">7</tspan></text><text x="1188" y="270" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:19px; font-weight:800; fill:#0f172a;"><tspan x="1188" dy="0">Job completed</tspan></text><text x="1188" y="330" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:14px; font-weight:400; fill:#475569;"><tspan x="1188" dy="0">Stats, retries,</tspan><tspan x="1188" dy="19">and errors remain</tspan><tspan x="1188" dy="19">visible</tspan></text><rect x="122" y="503" width="1160" height="88" rx="20" fill="#0f172a" opacity="0.06"/><rect x="120" y="500" width="1160" height="88" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="150" y="535" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:18px; font-weight:800; fill:#0f172a;"><tspan x="150" dy="0">Operational reason:</tspan></text><text x="320" y="535" text-anchor="start" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size:16px; font-weight:400; fill:#475569;"><tspan x="320" dy="0">Admins can see whether knowledge is pending, processing, completed, or failed. That is better than hiding</tspan><tspan x="320" dy="21">indexing behind a save button.</tspan></text></svg>
